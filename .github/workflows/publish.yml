name: Publish

# A tag v<version> (matching pyproject.toml and sudoo_cli.__version__) builds sudoo-cli, publishes it to PyPI with
# Trusted Publishing (no token is stored anywhere) and attaches the wheel, the source archive and the single-file
# zipapp (sudoo.pyz) to a GitHub release. One-time setup on pypi.org: Publishing -> Add a pending publisher:
# project sudoo-cli, owner Sudoo-sh, repository sudoo-cli, workflow publish.yml, environment pypi.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Check the tag matches the version
        run: |
          version="$(uv version --short)"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
          grep -q "__version__ = \"${version}\"" src/sudoo_cli/__init__.py || { echo "__version__ != ${version}"; exit 1; }
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv build
      - name: Build the zipapp
        run: |
          uv run python scripts/build_zipapp.py
          uv run python -I dist/sudoo.pyz version
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI Trusted Publishing
      contents: write # the GitHub release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Keep only the Python packages for PyPI
        run: mkdir release && mv dist/sudoo.pyz dist/SHA256SUMS release/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* release/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
